# Profile 'test' — context load KHÔNG cần Postgres thật, KHÔNG cần ML model.
# Flyway tắt; Hibernate không chạm metadata JDBC (tránh kết nối thật khi build EMF).

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Datasource trỏ localhost nhưng KHÔNG mở kết nối lúc khởi động (lazy + pool nhỏ).
spring.datasource.url=jdbc:postgresql://localhost:5433/docmind
spring.datasource.username=docmind
spring.datasource.password=docmind
spring.datasource.hikari.initialization-fail-timeout=-1
spring.sql.init.mode=never

# LLM: provider=stub bảo đảm môi trường test hermetic, 0 kết nối mạng ngoài
llm.provider=stub

# Gemini để trống & Ollama tắt trong profile test => StubLlmClient active.
gemini.api.keys=
ollama.enabled=false


