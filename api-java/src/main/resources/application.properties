spring.application.name=docmind-api
server.port=8090

# ============================================================
# Datasource — PostgreSQL + pgvector (deviation có chủ đích so với horoscope/Redis).
# Giá trị thật nằm trong .env; ngoài compose trỏ localhost:5433.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/docmind}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:docmind}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:docmind}

# JPA: Flyway sở hữu schema -> Hibernate chỉ validate, không auto-ddl.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway migrations (db/migration/V*.sql)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ============================================================
# doc-service-py (parser) — client REST, propagate X-Correlation-Id.
# ============================================================
docmind.doc-service.base-url=${DOC_SERVICE_BASE_URL:http://localhost:8091}
docmind.doc-service.connect-timeout-ms=${DOC_SERVICE_CONNECT_TIMEOUT_MS:5000}
docmind.doc-service.read-timeout-ms=${DOC_SERVICE_READ_TIMEOUT_MS:60000}
# Poll job tối đa bao lâu + chu kỳ poll (ms) khi chờ parse xong.
docmind.doc-service.poll-interval-ms=${DOC_SERVICE_POLL_INTERVAL_MS:1500}
docmind.doc-service.poll-max-attempts=${DOC_SERVICE_POLL_MAX_ATTEMPTS:40}
docmind.doc-service.internal-token=${DOCMIND_INTERNAL_TOKEN:${INTERNAL_API_TOKEN:${DOC_SERVICE_INTERNAL_TOKEN:docmind-internal-secret-token-2026}}}

# ============================================================
# LLM — Unified Multi-Provider Configuration (R4)
# Hỗ trợ: ollama | deepseek | grok | openai | gemini | openrouter | custom | stub
# ============================================================
llm.provider=${LLM_PROVIDER:ollama}
llm.model=${LLM_MODEL:}
llm.base-url=${LLM_BASE_URL:}
llm.api-key=${LLM_API_KEY:}
llm.temperature=${LLM_TEMPERATURE:0.2}
llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:120}
llm.reasoning-effort=${LLM_REASONING_EFFORT:}
llm.max-tokens=${LLM_MAX_TOKENS:0}
llm.fallback-provider=${LLM_FALLBACK_PROVIDER:}
llm.fallback-model=${LLM_FALLBACK_MODEL:}
llm.fallback-base-url=${LLM_FALLBACK_BASE_URL:}
llm.fallback-api-key=${LLM_FALLBACK_API_KEY:}

# Cấu hình dự phòng tương thích ngược (Legacy Fallback properties)
gemini.api.keys=${GEMINI_API_KEYS:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

ollama.enabled=${OLLAMA_ENABLED:true}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:14b-instruct-q5_K_M}
ollama.fallback-model=${OLLAMA_FALLBACK_MODEL:}
ollama.temperature=${OLLAMA_TEMPERATURE:0.3}
ollama.top-p=${OLLAMA_TOP_P:0.9}
ollama.repeat-penalty=${OLLAMA_REPEAT_PENALTY:1.08}
ollama.num-ctx=${OLLAMA_NUM_CTX:8192}
ollama.num-predict=${OLLAMA_NUM_PREDICT:2048}
ollama.keep-alive=${OLLAMA_KEEP_ALIVE:30m}
ollama.read-timeout-ms=${OLLAMA_READ_TIMEOUT_MS:240000}

# ============================================================
# Chat/RAG (Java-only) — tham số retrieval.
# ============================================================
docmind.chat.top-k=${DOCMIND_CHAT_TOP_K:5}
# Số ứng viên lấy ra mỗi arm (vector / full-text) trước khi RRF fuse.
docmind.chat.candidate-k=${DOCMIND_CHAT_CANDIDATE_K:20}
# Hằng số RRF (thường 60).
docmind.chat.rrf-k=${DOCMIND_CHAT_RRF_K:60}

# ============================================================
# Embedding — dim 384 khớp paraphrase-multilingual-MiniLM-L12-v2.
# remote.enabled=true => gọi doc-service-py POST /v1/embed (cùng base-url parser);
# lỗi/tắt => rơi về stub tất định cho đúng call đó (ingest không fail cứng).
# ============================================================
docmind.embedding.dim=${DOCMIND_EMBEDDING_DIM:384}
docmind.embedding.remote.enabled=${DOCMIND_EMBEDDING_REMOTE_ENABLED:true}
docmind.embedding.remote.endpoint-path=${DOCMIND_EMBEDDING_ENDPOINT_PATH:/v1/embed}

# File upload
spring.servlet.multipart.max-file-size=${DOCMIND_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${DOCMIND_MAX_REQUEST_SIZE:50MB}

# Logging level (dùng chung cả hai service qua DOCMIND_LOG_LEVEL)
logging.level.root=${DOCMIND_LOG_LEVEL:INFO}
logging.level.com.example.docmind=${DOCMIND_LOG_LEVEL:INFO}

# ============================================================
# Facebook Fanpage Webhook & Graph Send API (me/messages)
# ============================================================
docmind.fanpage.verify-token=${DOCMIND_FANPAGE_VERIFY_TOKEN:docmind-fb-verify-token}
docmind.fanpage.app-secret=${DOCMIND_FANPAGE_APP_SECRET:}
docmind.fanpage.page-access-token=${DOCMIND_FANPAGE_PAGE_ACCESS_TOKEN:}
docmind.fanpage.default-page-id=${DOCMIND_FANPAGE_DEFAULT_PAGE_ID:b23cd382-4f7a-4829-8c54-1d410da14bf8}
docmind.fanpage.bubble-delay-ms=${DOCMIND_FANPAGE_BUBBLE_DELAY_MS:2500}
docmind.fanpage.burst-debounce-ms=${DOCMIND_FANPAGE_BURST_DEBOUNCE_MS:1800}

# ============================================================
# Cognitive Architecture Mode (Feature Flag — Batch 1)
# DETERMINISTIC_V1 : 100% luồng cũ phục vụ đối chứng & rollback tức thì
# LLM_COGNITIVE_V2 : Luồng nhận thức ACI (Adaptive Conversation Intelligence)
# ============================================================
docmind.bot.cognitive-mode=${DOCMIND_BOT_COGNITIVE_MODE:LLM_COGNITIVE_V2}

# ============================================================
# Durable File-Backed Inbound WAL Recovery (Unit P0.1)
# ============================================================
docmind.inbox.wal.dir=${DOCMIND_INBOX_WAL_DIR:/var/lib/docmind/inbound-wal}
docmind.inbox.wal.max-bytes=${DOCMIND_INBOX_WAL_MAX_BYTES:67108864}
