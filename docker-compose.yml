# ============================================================
# DocMind — Full-Stack Docker Compose (1-Command Ubuntu & Dev Deploy)
#   postgres        : PostgreSQL 16 + pgvector (host 5433 -> 5432)
#   doc-service-py  : FastAPI document parser + embedding engine (host 8091 -> 8091)
#   agent-brain     : Hindsight Memory + Tactical Sales Brain Engine (host 8095 -> 8095)
#   api-java        : Spring Boot 4 orchestrator + RAG + Fanpage Bot (host 8090 -> 8090)
#   frontend        : Vue 3 SPA + Nginx Reverse Proxy /api -> api-java:8090 (host 3000 -> 80)
#   tunnel          : Cloudflare Quick Tunnel (Tự động cấp link https://*.trycloudflare.com
#                     miễn phí có sẵn SSL cho Chrome & Facebook Webhook mà không cần mua Domain)
#
# Quick start (Ubuntu / Linux / macOS / Windows):
#   chmod +x deploy.sh && ./deploy.sh
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docmind-postgres
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmind}
    ports:
      # Host 5433 tránh đụng Postgres cục bộ (5432) nếu có.
      - "5433:5432"
    volumes:
      - docmind-pgdata:/var/lib/postgresql/data
      # Chỉ chạy một lần khi khởi tạo volume: bật extension vector.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  doc-service-py:
    build: ./doc-service-py
    container_name: docmind-doc-service
    ports:
      - "8091:8091"
    env_file:
      - path: ./.env
        required: false
    environment:
      - DOCMIND_LOG_LEVEL=${DOCMIND_LOG_LEVEL:-INFO}
      # false = không ghi artifact debug (ảnh render, JSON trung gian) ra đĩa.
      - DOCMIND_PERSIST_ARTIFACTS=${DOCMIND_PERSIST_ARTIFACTS:-false}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-docmind-internal-secret-token-2026}
      - DOCMIND_INTERNAL_TOKEN=${INTERNAL_API_TOKEN:-docmind-internal-secret-token-2026}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  agent-brain:
    build: ./agent-brain
    container_name: docmind-agent-brain
    ports:
      - "8095:8095"
    environment:
      - AGENT_BRAIN_SQLITE_PATH=/data/agent_brain.db
    volumes:
      - docmind-braindata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api-java:
    build: ./api-java
    container_name: docmind-api
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      doc-service-py:
        condition: service_started
      agent-brain:
        condition: service_started
    env_file:
      - path: ./.env
        required: false
      - path: ./api-java/.env
        required: false
    environment:
      # Trong mạng compose dùng hostname service + cổng nội bộ 5432.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/docmind
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-docmind}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD:-docmind}}
      - DOC_SERVICE_BASE_URL=http://doc-service-py:8091
      - AGENT_BRAIN_BASE_URL=${AGENT_BRAIN_BASE_URL:-http://agent-brain:8095}
      - DOC_SERVICE_INTERNAL_TOKEN=${INTERNAL_API_TOKEN:-docmind-internal-secret-token-2026}
      - DOCMIND_INTERNAL_TOKEN=${INTERNAL_API_TOKEN:-docmind-internal-secret-token-2026}
      # Unified Multi-Provider LLM Configuration (R4)
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LLM_TOP_P=${LLM_TOP_P:-}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-0}
      # Legacy & Ollama-specific tuning (reads from LLM_* first, falls back to OLLAMA_*)
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_BASE_URL=${LLM_BASE_URL:-${OLLAMA_BASE_URL:-http://host.docker.internal:11434}}
      - OLLAMA_MODEL=${LLM_MODEL:-${OLLAMA_MODEL:-}}
      - OLLAMA_FALLBACK_MODEL=${OLLAMA_FALLBACK_MODEL:-}
      - OLLAMA_TEMPERATURE=${LLM_TEMPERATURE:-${OLLAMA_TEMPERATURE:-0.3}}
      - OLLAMA_TOP_P=${LLM_TOP_P:-${OLLAMA_TOP_P:-0.9}}
      - OLLAMA_REPEAT_PENALTY=${OLLAMA_REPEAT_PENALTY:-1.08}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-2048}
      - DOCMIND_LOG_LEVEL=${DOCMIND_LOG_LEVEL:-INFO}
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: docmind-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api-java:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: docmind-tunnel
    command: tunnel --no-autoupdate --protocol http2 ${CLOUDFLARE_TUNNEL_TOKEN:+run --token} ${CLOUDFLARE_TUNNEL_TOKEN:---url http://frontend:80}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  docmind-pgdata:
  docmind-braindata:
