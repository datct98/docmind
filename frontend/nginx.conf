server {
    listen 80;
    server_name _;

    # Cho phép upload file lớn (.pdf, .docx, .xlsx, ảnh scan) lên tới 100MB không bị lỗi 413
    client_max_body_size 100M;

    # Bật nén Gzip tăng tốc tải tài nguyên tĩnh và JSON response
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Docker internal DNS resolver — tự động cập nhật IP mới khi container api-java khởi động lại (tránh lỗi 502 Bad Gateway)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Reverse proxy toàn bộ /api/* sang Spring Boot orchestrator (api-java:8090)
    location /api/ {
        set $api_upstream http://api-java:8090;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dài (300s) để các truy vấn LLM / RAG / Parse tài liệu nặng không bị 504 Gateway Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Reverse proxy /actuator/* cho healthcheck / metrics nếu cần
    location /actuator/ {
        set $api_upstream http://api-java:8090;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phục vụ Vue 3 SPA (NotebookLM UI) với fallback về index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
